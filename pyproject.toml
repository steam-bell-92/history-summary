[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlens-zero"
version = "0.1.0"
description = "Zero-dependency Git history analyzer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gitlens = "src.main:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["src*"]
